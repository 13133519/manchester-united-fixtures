<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#DA291C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Manchester United Fixtures</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f3f3;
      color: #171717;
    }

    /* HEADER */

    header {
      background: #DA291C;
      color: white;
      padding: 24px 18px 22px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 23px;
      letter-spacing: 0.5px;
    }

    header p {
      margin: 7px 0 0;
      font-size: 14px;
      opacity: 0.9;
    }

    /* MAIN */

    .container {
      max-width: 700px;
      margin: auto;
      padding: 16px;
    }

    /* NEXT MATCH */

    .next-match {
      background: white;
      border-radius: 18px;
      padding: 22px 18px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      text-align: center;
    }

    .next-label {
      color: #DA291C;
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .next-opponent {
      font-size: 24px;
      font-weight: bold;
      margin: 13px 0 9px;
      line-height: 1.25;
    }

    .next-date {
      font-size: 16px;
      font-weight: bold;
      color: #333;
    }

    .next-time {
      font-size: 30px;
      font-weight: bold;
      margin: 7px 0;
    }

    .next-time.tbc {
      color: #8a6500;
    }

    .next-competition {
      color: #666;
      font-size: 14px;
      margin-top: 4px;
    }

    .next-homeaway {
      display: inline-block;
      margin-top: 10px;
      background: #f1f1f1;
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
    }

    /* FILTERS */

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 18px;
      padding-bottom: 3px;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .filters button {
      border: 0;
      border-radius: 20px;
      padding: 10px 15px;
      background: white;
      color: #222;
      font-weight: bold;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }

    .filters button.active {
      background: #DA291C;
      color: white;
    }

    /* MONTH */

    .month {
      font-size: 18px;
      font-weight: bold;
      margin: 23px 0 10px;
    }

    /* FIXTURE */

    .fixture {
      background: white;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 9px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 7px rgba(0,0,0,0.06);
    }

    .fixture-date {
      width: 52px;
      text-align: center;
      color: #666;
      flex-shrink: 0;
    }

    .fixture-date strong {
      display: block;
      font-size: 21px;
      color: #111;
      line-height: 1;
      margin-bottom: 4px;
    }

    .fixture-date span {
      font-size: 11px;
      text-transform: uppercase;
    }

    .fixture-info {
      flex: 1;
      min-width: 0;
    }

    .fixture-opponent {
      font-weight: bold;
      font-size: 16px;
      line-height: 1.25;
    }

    .fixture-meta {
      color: #666;
      font-size: 12px;
      margin-top: 5px;
    }

    .home {
      color: #287528;
      font-weight: bold;
    }

    .away {
      color: #8a3f00;
      font-weight: bold;
    }

    .fixture-time {
      min-width: 45px;
      text-align: right;
      font-weight: bold;
      font-size: 16px;
    }

    .fixture-time.tbc {
      color: #8a6500;
      font-size: 14px;
    }

    /* STATUS */

    .status {
      display: inline-block;
      margin-top: 6px;
      padding: 3px 6px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: bold;
      background: #fff2cc;
      color: #806000;
    }

    .status.confirmed {
      background: #e2f0d9;
      color: #287528;
    }

    /* LOADING / ERROR */

    .loading,
    .error,
    .empty {
      background: white;
      border-radius: 14px;
      padding: 20px;
      text-align: center;
    }

    .error {
      color: #b00020;
    }

    /* FOOTER */

    .footer {
      text-align: center;
      color: #777;
      font-size: 11px;
      padding: 25px 10px;
    }

    /* MOBILE */

    @media (max-width: 500px) {

      header h1 {
        font-size: 21px;
      }

      .container {
        padding: 12px;
      }

      .next-opponent {
        font-size: 21px;
      }

      .next-time {
        font-size: 28px;
      }

      .fixture {
        padding: 14px 12px;
        gap: 9px;
      }

      .fixture-date {
        width: 45px;
      }

      .fixture-opponent {
        font-size: 15px;
      }

      .fixture-time {
        font-size: 15px;
        min-width: 40px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🔴 MANCHESTER UNITED</h1>
  <p>2026/27 Fixtures</p>
</header>

<main class="container">

  <!-- NEXT MATCH -->

  <section class="next-match" id="nextMatch">

    <div class="next-label">
      Next Match
    </div>

    <div class="loading">
      Loading...
    </div>

  </section>

  <!-- FILTERS -->

  <div class="filters" id="filters">

    <button class="active" data-filter="All">
      All
    </button>

    <button data-filter="Premier League">
      Premier League
    </button>

    <button data-filter="Champions League">
      Champions League
    </button>

    <button data-filter="FA Cup">
      FA Cup
    </button>

    <button data-filter="Carabao Cup">
      Carabao Cup
    </button>

  </div>

  <!-- FIXTURES -->

  <section id="fixtures">

    <div class="loading">
      Loading fixtures...
    </div>

  </section>

  <div class="footer">
    Manchester United 2026/27 Fixtures
  </div>

</main>


<script>

/*
====================================================
MANCHESTER UNITED FIXTURE APP
====================================================

The website reads fixture information from your
Google Sheet through Google Apps Script.

You do NOT need to edit this URL unless the
Apps Script deployment changes.
====================================================
*/

const API_URL =
"https://script.google.com/macros/s/AKfycbxak67aZihpH2B0a3Ls46HZubqv7P0h5VM7QF5fTmD9EGGEvqw3IES2B7PBt6-uuvEH/exec";


let fixtures = [];

let currentFilter = "All";


/*
====================================================
LOAD FIXTURES
====================================================
*/

async function loadFixtures() {

  try {

    const response = await fetch(API_URL, {
      method: "GET",
      redirect: "follow",
      mode: "cors"
    });

    if (!response.ok) {

      throw new Error(
        "HTTP error: " + response.status
      );

    }

    const text = await response.text();

    fixtures = JSON.parse(text);

    /*
    Only use rows that contain a date.
    */

    fixtures = fixtures
      .filter(fixture => fixture.Date)
      .sort(
        (a, b) =>
          new Date(a.Date) -
          new Date(b.Date)
      );


    showNextMatch();

    showFixtures();


  } catch (error) {

    console.error(error);

    document.getElementById(
      "fixtures"
    ).innerHTML = `

      <div class="error">

        <strong>
          Unable to load fixtures
        </strong>

        <br><br>

        Please refresh the page.

      </div>

    `;

  }

}


/*
====================================================
CHECK WHETHER KICK-OFF IS CONFIRMED
====================================================
*/

function isConfirmed(fixture) {

  return String(
    fixture.Status || ""
  )
    .trim()
    .toLowerCase() === "confirmed";

}


/*
====================================================
GET KICK-OFF
====================================================

Only display the time if the fixture is
officially marked as Confirmed.

Otherwise display TBC.
====================================================
*/

function getKickoff(fixture) {

  if (
    isConfirmed(fixture) &&
    fixture["Kick-off"]
  ) {

    return fixture["Kick-off"];

  }

  return "TBC";

}


/*
====================================================
NEXT MATCH
====================================================
*/

function showNextMatch() {

  const today = new Date();

  const next = fixtures.find(
    fixture =>
      new Date(fixture.Date) >= today
  );


  const container =
    document.getElementById(
      "nextMatch"
    );


  if (!next) {

    container.innerHTML = `

      <div class="next-label">
        Next Match
      </div>

      <div class="empty">
        No upcoming fixtures.
      </div>

    `;

    return;

  }


  let opponent;


  if (
    next["Home/Away"] === "Home"
  ) {

    opponent =
      "Manchester United vs " +
      next.Opponent;

  } else {

    opponent =
      next.Opponent +
      " vs Manchester United";

  }


  const kickoff =
    getKickoff(next);


  const confirmed =
    isConfirmed(next);


  container.innerHTML = `

    <div class="next-label">
      Next Match
    </div>

    <div class="next-opponent">
      ${opponent}
    </div>

    <div class="next-date">
      ${formatDate(next.Date)}
    </div>

    <div class="next-time ${
      confirmed ? "" : "tbc"
    }">

      ${kickoff}

    </div>

    <div class="next-competition">
      ${next.Competition}
    </div>

    <div class="next-homeaway">

      ${
        next["Home/Away"] ||
        "TBC"
      }

    </div>

  `;

}


/*
====================================================
DISPLAY FIXTURES
====================================================
*/

function showFixtures() {

  const container =
    document.getElementById(
      "fixtures"
    );


  const filtered =
    currentFilter === "All"

      ? fixtures

      : fixtures.filter(
          fixture =>
            fixture.Competition ===
            currentFilter
        );


  if (!filtered.length) {

    container.innerHTML = `

      <div class="empty">
        No fixtures found.
      </div>

    `;

    return;

  }


  let html = "";

  let currentMonth = "";


  filtered.forEach(fixture => {

    const date =
      new Date(fixture.Date);


    const month =
      date.toLocaleDateString(
        "en-GB",
        {
          month: "long",
          year: "numeric"
        }
      );


    /*
    Add month heading.
    */

    if (
      month !== currentMonth
    ) {

      currentMonth = month;

      html += `

        <div class="month">
          ${month}
        </div>

      `;

    }


    /*
    Home / Away.
    */

    const homeAway =
      fixture["Home/Away"] ||
      "TBC";


    const homeAwayClass =
      homeAway === "Home"
        ? "home"
        : homeAway === "Away"
          ? "away"
          : "";


    /*
    Opponent display.
    */

    let opponent;


    if (
      homeAway === "Home"
    ) {

      opponent =
        "Manchester United vs " +
        fixture.Opponent;

    } else if (
      homeAway === "Away"
    ) {

      opponent =
        fixture.Opponent +
        " vs Manchester United";

    } else {

      opponent =
        fixture.Opponent;

    }


    /*
    Kick-off.
    */

    const confirmed =
      isConfirmed(fixture);


    const kickoff =
      getKickoff(fixture);


    /*
    Status.
    */

    const statusClass =
      confirmed
        ? "confirmed"
        : "";


    html += `

      <div class="fixture">

        <div class="fixture-date">

          <strong>
            ${date.getDate()}
          </strong>

          <span>
            ${date.toLocaleDateString(
              "en-GB",
              {
                weekday: "short"
              }
            )}
          </span>

        </div>


        <div class="fixture-info">

          <div class="fixture-opponent">

            ${opponent}

          </div>


          <div class="fixture-meta">

            <span class="${homeAwayClass}">
              ${homeAway}
            </span>

            ·

            ${fixture.Competition}

          </div>


          <div class="status ${statusClass}">

            ${
              confirmed
                ? "✓ Confirmed"
                : (
                    fixture.Status ||
                    "TBC"
                  )
            }

          </div>

        </div>


        <div class="fixture-time ${
          confirmed
            ? ""
            : "tbc"
        }">

          ${kickoff}

        </div>

      </div>

    `;

  });


  container.innerHTML = html;

}


/*
====================================================
FORMAT DATE
====================================================
*/

function formatDate(dateString) {

  return new Date(dateString)
    .toLocaleDateString(
      "en-GB",
      {
        weekday: "long",
        day: "numeric",
        month: "long"
      }
    );

}


/*
====================================================
FILTER BUTTONS
====================================================
*/

document
  .getElementById("filters")
  .addEventListener(
    "click",
    function(event) {

      if (
        event.target.tagName !==
        "BUTTON"
      ) {

        return;

      }


      document
        .querySelectorAll(
          ".filters button"
        )
        .forEach(button =>
          button.classList.remove(
            "active"
          )
        );


      event.target.classList.add(
        "active"
      );


      currentFilter =
        event.target.dataset.filter;


      showFixtures();

    }
  );


/*
====================================================
START APP
====================================================
*/

loadFixtures();

</script>

</body>
</html>
