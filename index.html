<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#DA291C">

  <title>Manchester United Fixtures</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f3f3;
      color: #171717;
    }

    header {
      background: #DA291C;
      color: white;
      padding: 24px 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 23px;
    }

    header p {
      margin: 6px 0 0;
      font-size: 14px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 16px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .next-title {
      text-align: center;
      color: #DA291C;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 14px;
    }

    .next-opponent {
      text-align: center;
      font-size: 25px;
      font-weight: bold;
      margin: 12px 0;
    }

    .next-date {
      text-align: center;
      font-weight: bold;
      font-size: 17px;
    }

    .next-time {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      margin: 7px 0;
    }

    .next-comp {
      text-align: center;
      color: #666;
      font-size: 14px;
    }

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 18px;
      padding-bottom: 4px;
    }

    .filters button {
      border: 0;
      border-radius: 20px;
      padding: 10px 15px;
      background: white;
      font-weight: bold;
      white-space: nowrap;
    }

    .filters button.active {
      background: #DA291C;
      color: white;
    }

    .month {
      font-size: 18px;
      font-weight: bold;
      margin: 22px 0 10px;
    }

    .fixture {
      background: white;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 9px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 7px rgba(0,0,0,0.06);
    }

    .date {
      width: 52px;
      text-align: center;
      color: #666;
      flex-shrink: 0;
    }

    .date strong {
      display: block;
      font-size: 20px;
      color: #111;
    }

    .info {
      flex: 1;
    }

    .opponent {
      font-weight: bold;
      font-size: 16px;
    }

    .meta {
      color: #666;
      font-size: 12px;
      margin-top: 5px;
    }

    .time {
      font-weight: bold;
      font-size: 16px;
    }

    .status {
      display: inline-block;
      margin-top: 6px;
      padding: 3px 6px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: bold;
      background: #fff2cc;
      color: #806000;
    }

    .confirmed {
      background: #e2f0d9;
      color: #287528;
    }

    .error {
      text-align: center;
      background: white;
      padding: 20px;
      border-radius: 12px;
      color: #b00020;
    }

    .footer {
      text-align: center;
      color: #777;
      font-size: 12px;
      padding: 25px;
    }
  </style>
</head>

<body>

<header>
  <h1>🔴 MANCHESTER UNITED</h1>
  <p>2026/27 Fixtures</p>
</header>

<main class="container">

  <section class="card" id="nextMatch">
    <div class="next-title">Next Match</div>
    <div>Loading...</div>
  </section>

  <div class="filters" id="filters">
    <button class="active" data-filter="All">All</button>
    <button data-filter="Premier League">Premier League</button>
    <button data-filter="Champions League">Champions League</button>
    <button data-filter="FA Cup">FA Cup</button>
    <button data-filter="Carabao Cup">Carabao Cup</button>
  </div>

  <section id="fixtures">
    <div>Loading fixtures...</div>
  </section>

  <div class="footer">
    Manchester United 2026/27
  </div>

</main>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxak67aZihpH2B0a3Ls46HZubqv7P0h5VM7QF5fTmD9EGGEvqw3IES2B7PBt6-uuvEH/exec";

let fixtures = [];
let currentFilter = "All";

async function loadFixtures() {

  try {

    const response = await fetch(API_URL, {
      method: "GET",
      redirect: "follow",
      mode: "cors"
    });

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const text = await response.text();

    fixtures = JSON.parse(text);

    fixtures = fixtures
      .filter(f => f.Date)
      .sort((a,b) =>
        new Date(a.Date) - new Date(b.Date)
      );

    showNextMatch();
    showFixtures();

  } catch (error) {

    console.error(error);

    document.getElementById("fixtures").innerHTML = `
      <div class="error">
        <strong>Unable to load fixtures.</strong>
        <br><br>
        The fixture database could not be reached.
      </div>
    `;

  }
}

function showNextMatch() {

  const today = new Date();

  const next = fixtures.find(f =>
    new Date(f.Date) >= today
  );

  if (!next) return;

  const opponent =
    next["Home/Away"] === "Home"
      ? "Manchester United vs " + next.Opponent
      : next.Opponent + " vs Manchester United";

  document.getElementById("nextMatch").innerHTML = `

    <div class="next-title">
      Next Match
    </div>

    <div class="next-opponent">
      ${opponent}
    </div>

    <div class="next-date">
      ${formatDate(next.Date)}
    </div>

    <div class="next-time">
      ${next["Kick-off"] || "TBC"}
    </div>

    <div class="next-comp">
      ${next.Competition}
    </div>

  `;
}

function showFixtures() {

  const container =
    document.getElementById("fixtures");

  const filtered =
    currentFilter === "All"
      ? fixtures
      : fixtures.filter(f =>
          f.Competition === currentFilter
        );

  let html = "";
  let month = "";

  filtered.forEach(f => {

    const date = new Date(f.Date);

    const currentMonth =
      date.toLocaleDateString("en-GB", {
        month: "long",
        year: "numeric"
      });

    if (currentMonth !== month) {

      month = currentMonth;

      html += `
        <div class="month">
          ${month}
        </div>
      `;
    }

    const opponent =
      f["Home/Away"] === "Home"
        ? "Manchester United vs " + f.Opponent
        : f.Opponent + " vs Manchester United";

    const statusClass =
      String(f.Status || "")
        .toLowerCase()
        .includes("confirmed")
        ? "confirmed"
        : "";

    html += `

      <div class="fixture">

        <div class="date">

          <strong>
            ${date.getDate()}
          </strong>

          ${date.toLocaleDateString(
            "en-GB",
            { weekday: "short" }
          )}

        </div>

        <div class="info">

          <div class="opponent">
            ${opponent}
          </div>

          <div class="meta">
            ${f["Home/Away"] || "TBC"}
            ·
            ${f.Competition}
          </div>

          <div class="status ${statusClass}">
            ${f.Status || "TBC"}
          </div>

        </div>

        <div class="time">
          ${f["Kick-off"] || "TBC"}
        </div>

      </div>

    `;
  });

  container.innerHTML =
    html || "<div>No fixtures found.</div>";
}

function formatDate(dateString) {

  return new Date(dateString)
    .toLocaleDateString(
      "en-GB",
      {
        weekday: "long",
        day: "numeric",
        month: "long"
      }
    );
}

document
  .getElementById("filters")
  .addEventListener("click", function(e) {

    if (e.target.tagName !== "BUTTON") return;

    document
      .querySelectorAll(".filters button")
      .forEach(b =>
        b.classList.remove("active")
      );

    e.target.classList.add("active");

    currentFilter =
      e.target.dataset.filter;

    showFixtures();

  });

loadFixtures();

</script>

</body>
</html>
